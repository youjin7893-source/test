<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS 환경 미생물 데이터 분석 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #f1c40f;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .controls {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        select, button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1a252f;
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid var(--accent-color);
        }
        .kpi-title {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .kpi-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
        }
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chart-card.full-width {
            grid-column: span 2;
        }
        canvas {
            max-width: 100%;
        }
        
        @media (max-width: 768px) {
            .kpi-container {
                grid-template-columns: 1fr;
            }
            .charts-container {
                grid-template-columns: 1fr;
            }
            .chart-card.full-width {
                grid-column: span 1;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls label {
                margin-bottom: -5px;
            }
        }
    </style>
</head>
<body>

            <div class="kpi-value" id="kpi-gc">0%</div>

    <div class="charts-container">

</div>

                    }
                }
                return label;
            }
        }
    };

    function initDashboard() {
        document.getElementById('filter-method').addEventListener('change', (e) => updateDashboard(e.target.value));
        document.getElementById('btn-reset').addEventListener('click', () => {
            document.getElementById('filter-method').value = 'All';
            updateDashboard('All');
        });
        updateDashboard('All');
    }

    function updateDashboard(methodFilter) {
        const filteredData = methodFilter === 'All' ? rawData : rawData.filter(d => d['채취방법'] === methodFilter);
        
        const total = filteredData.length;
        document.getElementById('kpi-total').innerText = total + '건';
        
        if (total > 0) {
            const avgN50 = filteredData.reduce((sum, d) => sum + (d['N50'] || 0), 0) / total;
            document.getElementById('kpi-n50').innerText = avgN50.toLocaleString(undefined, {maximumFractionDigits: 0});
            
            const avgGC = filteredData.reduce((sum, d) => sum + (d['GC함량'] || 0), 0) / total;
            document.getElementById('kpi-gc').innerText = avgGC.toFixed(2) + '%';
        } else {
            document.getElementById('kpi-n50').innerText = '0';
            document.getElementById('kpi-gc').innerText = '0%';
        }

        renderBarChart(filteredData);
        renderHistChart(filteredData);
        renderLineChart(filteredData);
    }

    function renderBarChart(data) {
        const sessions = ['F4', 'F5', 'F6', 'F7'];
        const counts = sessions.map(s => data.filter(d => d['세션'] === s).length);

        const ctx = document.getElementById('chart-bar').getContext('2d');
        if(barChart) barChart.destroy();
        
        barChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sessions,
                datasets: [{
                    label: '샘플 건수',
                    data: counts,
                    backgroundColor: 'rgba(241, 196, 15, 0.7)',
                    borderColor: 'rgba(241, 196, 15, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: '세션별 샘플 건수', font: { size: 16 } },
                    tooltip: tooltipOptions
                },
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: '건수' }, ticks: { stepSize: 1 } },
                    x: { title: { display: true, text: '세션 (Session)' } }
                }
            }
        });
    }

    function renderHistChart(data) {
        const bins = ['30~40%', '40~50%', '50~60%', '60~70%'];
        let counts = [0, 0, 0, 0];
        
        data.forEach(d => {
            const gc = d['GC함량'];
            if(gc >= 30 && gc < 40) counts[0]++;
            else if(gc >= 40 && gc < 50) counts[1]++;
            else if(gc >= 50 && gc < 60) counts[2]++;
            else if(gc >= 60 && gc <= 70) counts[3]++;
        });

        const ctx = document.getElementById('chart-hist').getContext('2d');
        if(histChart) histChart.destroy();
        
        histChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: bins,
                datasets: [{
                    label: '샘플 분포수',
                    data: counts,
                    backgroundColor: 'rgba(46, 204, 113, 0.7)',
                    borderColor: 'rgba(46, 204, 113, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'GC함량 분포 (히스토그램)', font: { size: 16 } },
                    tooltip: tooltipOptions
                },
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: '건수' }, ticks: { stepSize: 1 } },
                    x: { title: { display: true, text: 'GC함량 구간' } }
                }
            }
        });
    }

    function renderLineChart(data) {
        const sessions = ['F4', 'F5', 'F6', 'F7'];
        const avgN50 = sessions.map(s => {
            const sData = data.filter(d => d['세션'] === s);
            if(sData.length === 0) return null;
            return sData.reduce((sum, d) => sum + (d['N50'] || 0), 0) / sData.length;
        });

        const ctx = document.getElementById('chart-line').getContext('2d');
        if(lineChart) lineChart.destroy();
        
        lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: sessions,
                datasets: [{
                    label: '평균 N50',
                    data: avgN50,
                    backgroundColor: 'rgba(155, 89, 182, 0.2)',
                    borderColor: 'rgba(155, 89, 182, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(155, 89, 182, 1)',
                    pointRadius: 5,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: '세션별 평균 N50 추이 (유전체 조립 품질)', font: { size: 16 } },
                    tooltip: tooltipOptions
                },
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: '평균 N50' } },
                    x: { title: { display: true, text: '세션 흐름 (시간순)' } }
                }
            }
        });
    }

    window.onload = initDashboard;
</script>
</body>
</html>
